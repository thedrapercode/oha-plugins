<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
  </defs>
  <!-- Tombstone shape -->
  <rect x="11" y="20" width="26" height="22" rx="2" fill="url(#tg)" stroke="#333" stroke-width="1.2"/>
  <!-- Rounded top -->
  <ellipse cx="24" cy="20" rx="13" ry="10" fill="url(#tg)" stroke="#333" stroke-width="1.2"/>
  <!-- RIP text area -->
  <rect x="15" y="24" width="18" height="13" rx="1" fill="#333" opacity="0.4"/>
  <!-- RIP carved letters -->
  <text x="24" y="33" text-anchor="middle" font-family="serif" font-size="9" font-weight="bold" fill="#b0b0b0" letter-spacing="1">RIP</text>
  <!-- Cross on top -->
  <rect x="22.5" y="13" width="3" height="9" rx="0.5" fill="#555"/>
  <rect x="18" y="16" width="12" height="3" rx="0.5" fill="#555"/>
  <!-- Grass at base -->
  <ellipse cx="24" cy="42" rx="16" ry="3" fill="#2d4a1e" opacity="0.6"/>
</svg>
